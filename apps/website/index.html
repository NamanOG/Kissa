<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Values in %PERCENT% are filled in at build time by vite.config.ts -->

    <!-- Primary -->
    <title>Kissa | Free Vinyl Player for Windows 10 &amp; 11</title>
    <meta
      name="description"
      content="Kissa is a free vinyl player for Windows 10 and 11. Play along with Spotify or Apple Music, enjoy your own albums, and revisit your listening with Pressed."
    />
    <meta name="author" content="Naman Bagdiya (GlyphCode)" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="%SITE_URL%" />
    <meta name="google-site-verification" content="CCLEY2UaHOR_G5LGEbk4U58J2rovljapoMNgCZhT5-w" />
    <meta name="google-site-verification" content="o4ItabUwyW1EeQkaXbSUKj9TqDZuLFCwZLYN_8KXRYs" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kissa" />
    <meta property="og:title" content="Kissa | Free Vinyl Player for Windows" />
    <meta
      property="og:description"
      content="Kissa is a free vinyl player for Windows 10 and 11. Play along with Spotify or Apple Music, enjoy your own albums, and revisit your listening with Pressed."
    />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og-kissa-deck.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1080" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kissa | Free Vinyl Player for Windows" />
    <meta
      name="twitter:description"
      content="Whatever you're playing in Spotify, Apple Music or TIDAL, as a record on your desktop. Free, for Windows 10 &amp; 11."

    <meta name="twitter:image:alt" content="Kissa playing a record on its desktop turntable, with the album cover and track details beside it" />

    <!-- Icons -->
    <!-- Tab icons: the app's small-size mark at each exact size (scripts/make-brand-marks.py) -->

    <link rel="icon" type="image/png" sizes="20x20" href="/brand/favicon-20.png" />

    <link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon-48.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="theme-color" content="#0d0c0b" />
    <style>
      html {
        background: #0d0c0b;
      }
    </style>

    <!-- Fonts: Mona Sans (variable width + weight), Martian Mono, Zen Kaku Gothic New (喫茶 only) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,300..700&family=Martian+Mono:wght@400;500&display=swap"
    />

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500&text=%E5%96%AB%E8%8C%B6&display=swap"
    />

    <!-- Structured data (SoftwareApplication, FAQPage, WebSite, Person) is injected here at build time -->
    %STRUCTURED_DATA%
  </head>
  <body>
    <div id="root"></div>
    <!--
      For readers and crawlers without JavaScript. It says the same things as
      the page React renders above.
    -->
    <noscript>
      <style>#root { display: none; }</style>
      <main style="max-width: 44rem; margin: 0 auto; padding: 4rem 1.5rem; font-family: system-ui, sans-serif; color: #edeae3">
        <h1>Kissa: a free vinyl player for Windows</h1>
        <p>
          Kissa is a desktop music player for Windows 10 and 11 that turns whatever you are already playing into a
          record on a turntable. It follows Spotify, Apple Music, TIDAL, local media players and music in your
          browser through the Windows media session, so there is nothing to connect and no account to sign in to.
        </p>
        <p><a href="%DOWNLOAD_URL%" style="color: #d98a4a">Get Kissa from the Microsoft Store</a>. Free, for Windows 10 and 11.</p>
        <h2>What it does</h2>
        <ul>
          <li>A turntable with real platter inertia, at 33⅓ or 45 RPM</li>
          <li>A tonearm you can drag across the record to seek through the track</li>
          <li>Synced lyrics, line by line and word by word</li>
          <li>Eight listening rooms, Moving light in the album cover's colours, a room light dimmer and a sleep timer</li>
          <li>Three turntable finishes and special pressings, including an optional record coloured to match the album</li>
          <li>Recorded turntable sounds: needle drops and soft mechanical keys</li>
          <li>Party mode (P), Listening Display (D) and a native Windows screensaver</li>
          <li>A record shelf of what you have listened to, to flip through as a crate</li>
          <li>Pressed: your week, month or year in music as a short moving story, with a card to share. Stays on your PC.</li>
          <li>Phone remote on the same Wi-Fi, with a QR code or 6-digit code. No account.</li>
          <li>Your own album folders with Kissa Hi-Fi vinyl sound, a dust lid, record sides and the sleeve back</li>
          <li>A mini player that shows only the record, with controls on hover</li>
          <li>English and Spanish</li>
          <li>A Focus Room for studying, writing or any focused work: Rain, Snow, Forest, Night and Fireplace rooms with real nature recordings, a focus timer with breaks, small steps and a weekly view</li>
          <li>Optional Discord status for what you are playing or focusing on</li>
        </ul>
        <p><a href="https://github.com/NamanOG/Kissa" style="color: #d98a4a">Source code on GitHub</a></p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
