appId: com.namanog.kissa
productName: Kissa
electronDist: ../../node_modules/electron/dist
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  # The .NET helper projects are compiled to resources/ before packaging; their
  # sources and bin/obj/publish output (hundreds of MB) must not ship.
  - '!screensaver/**'
  - '!smtc-helper/**'
  - '!scripts/**'
  # Shipped once each, outside the archive, via extraResources / extraFiles below.
  - '!resources/smtc-helper.exe'
  - '!resources/Kissa.scr'
  - '!{vitest.config.ts,tsconfig*.json,tailwind.config.js,postcss.config.js}'
extraResources:
  - from: "resources"
    to: "."
    filter:
      - "smtc-helper.exe"
extraFiles:
  - from: "resources"
    to: "."
    filter:
      - "Kissa.scr"
asarUnpack:
  - resources/**
  - node_modules/@coooookies/windows-smtc-monitor/**/*
win:
  executableName: Kissa
  signExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  include: build/installer.nsh
  artifactName: ${productName}-Setup-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  runAfterFinish: true
  deleteAppDataOnUninstall: false
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
# Microsoft Store (MSIX) package. Built only by `npm run build:store`; it is not
# part of `win.target`, so the regular release is unaffected.
# identityName / publisher / publisherDisplayName are the values Partner Center
# shows under Product identity. They must match it exactly.
appx:
  artifactName: ${productName}-Store-${version}.${ext}
  applicationId: Kissa
  identityName: GlyphCode.Kissa
  publisher: CN=EA71DE1F-A797-4E0B-B533-577BD634E912
  publisherDisplayName: GlyphCode
  displayName: Kissa
  backgroundColor: '#0f0b07'
  languages:
    - en-US
  # uap10 (startup task arguments) needs Windows 10 2004+
  minVersion: 10.0.19041.0
  maxVersionTested: 10.0.26100.0
  customManifestPath: appx-manifest.xml
  capabilities:
    - runFullTrust
npmRebuild: false
publish:
  provider: github
  owner: NamanOG
  repo: Kissa
