name: Release Kissa

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows Executables
        run: npm run build:win

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Kissa ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            apps/desktop/dist/Kissa-Setup-*.exe
            apps/desktop/dist/Kissa-Portable-*.exe
          body: |
            ## Kissa is now on the Microsoft Store

            **[Get Kissa from the Microsoft Store](https://apps.microsoft.com/detail/9p3n4x4wm80j)** - free, no SmartScreen prompt, and it keeps itself up to date.

            The Store is now the recommended way to install Kissa. If you installed an earlier version with the `.exe` below, uninstall it and install from the Store instead. The installer and portable build attached here remain for anyone who cannot use the Store.
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false


